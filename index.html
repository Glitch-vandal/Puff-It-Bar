<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#09131f" />
  <title>Mobile Racing Game</title>
  <style>
    :root {
      --bg-top: #07141d;
      --bg-bottom: #10283a;
      --road-dark: #2b2d33;
      --road-light: #30343b;
      --grass-dark: #1f3d35;
      --grass-light: #2a5a49;
      --line: #f5f7ff;
      --lane: #dfe7ff;
      --player: #ff7b00;
      --enemy: #42c6ff;
      --danger: #ef476f;
      --white: #f5fbff;
      --hud-bg: rgba(11, 17, 22, 0.35);
      --shadow: rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(var(--bg-top), var(--bg-bottom));
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      overscroll-behavior: none;
    }

    body {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(var(--bg-top), var(--bg-bottom));
    }

    .game-shell {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(var(--bg-top), var(--bg-bottom));
    }

    canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(#07131f, #10283a);
    }

    .hud {
      position: absolute;
      top: max(18px, env(safe-area-inset-top));
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 3;
      pointer-events: none;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
    }

    .hud-box {
      background: var(--hud-bg);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: clamp(14px, 2vw, 20px);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    .touch-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(18px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 5;
      padding: 0 18px;
      pointer-events: none;
    }

    .left-controls, .right-controls {
      display: flex;
      gap: 12px;
      pointer-events: auto;
    }

    .button {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      box-shadow: 0 8px 18px rgba(0,0,0,0.22);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      transition: transform 0.08s ease, background 0.08s ease;
      touch-action: none;
    }

    .button.small {
      width: 64px;
      height: 64px;
      font-size: 24px;
    }

    .button.active {
      transform: scale(0.96);
      background: rgba(255,255,255,0.18);
    }

    .start-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(3, 8, 12, 0.45);
      text-align: center;
      pointer-events: none;
    }

    .start-box {
      background: rgba(12, 18, 26, 0.62);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 24px 26px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.28);
      pointer-events: auto;
      max-width: min(90vw, 420px);
    }

    .start-box h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 58px);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .start-box p {
      margin: 8px 0;
      font-size: clamp(15px, 2vw, 19px);
      opacity: 0.9;
    }

    .cta {
      display: inline-block;
      margin-top: 12px;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      background: linear-gradient(#ff9f1c, #ff7b00);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(255,123,0,0.35);
    }

    @media (max-width: 560px) {
      .button {
        width: 68px;
        height: 68px;
      }
      .button.small {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="hud-box">Score: <span id="score">0</span></div>
      <div class="hud-box">Lives: <span id="lives">3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div class="touch-controls">
      <div class="left-controls">
        <div class="button small" id="leftBtn" aria-label="Steer left">◀</div>
        <div class="button small" id="rightBtn" aria-label="Steer right">▶</div>
      </div>

      <div class="right-controls">
        <div class="button" id="brakeBtn" aria-label="Brake">▼</div>
        <div class="button" id="gasBtn" aria-label="Accelerate">▲</div>
      </div>
    </div>

    <div class="start-overlay" id="startOverlay">
      <div class="start-box">
        <h1>Race</h1>
        <p>Use touch controls or keyboard</p>
        <p>Steer, avoid traffic, and survive longer</p>
        <button class="cta" id="startBtn">Start</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;

    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const startOverlay = document.getElementById("startOverlay");
    const startBtn = document.getElementById("startBtn");

    const leftBtn = document.getElementById("leftBtn");
    const rightBtn = document.getElementById("rightBtn");
    const brakeBtn = document.getElementById("brakeBtn");
    const gasBtn = document.getElementById("gasBtn");

    const input = {
      left: false,
      right: false,
      gas: false,
      brake: false
    };

    const state = {
      started: false,
      over: false,
      score: 0,
      lives: 3,
      speed: 0,
      playerX: 0,
      maxSpeed: 170,
      distance: 0,
      flashTimer: 0,
      traffic: [],
      lastTime: 0,
      width: window.innerWidth,
      height: window.innerHeight
    };

    const SETTINGS = {
      maxTraffic: 10,
      worldLength: 1800,
      roadWidthMin: 160,
      roadWidthMax: 620
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function resizeCanvas() {
      state.width = window.innerWidth;
      state.height = window.innerHeight;

      canvas.width = Math.round(state.width * dpr);
      canvas.height = Math.round(state.height * dpr);

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
    }

    function updateHud() {
      scoreEl.textContent = Math.floor(state.score);
      livesEl.textContent = state.lives;
    }

    function showStart() {
      startOverlay.style.display = "flex";
    }

    function startGame() {
      state.started = true;
      state.over = false;
      state.score = 0;
      state.lives = 3;
      state.speed = 60;
      state.playerX = 0;
      state.distance = 0;
      state.flashTimer = 0;
      state.traffic = [];
      state.lastTime = 0;
      startOverlay.style.display = "none";
      updateHud();
    }

    function resetGame() {
      state.started = false;
      state.over = false;
      state.score = 0;
      state.lives = 3;
      state.speed = 0;
      state.playerX = 0;
      state.distance = 0;
      state.flashTimer = 0;
      state.traffic = [];
      state.lastTime = 0;
      updateHud();
      showStart();
    }

    function setButtonState(el, active) {
      el.classList.toggle("active", active);
    }

    function bindButtonEvents(el, key) {
      const press = (event) => {
        event.preventDefault();
        input[key] = true;
        setButtonState(el, true);
      };

      const release = (event) => {
        event.preventDefault();
        input[key] = false;
        setButtonState(el, false);
      };

      el.addEventListener("pointerdown", press);
      el.addEventListener("pointerup", release);
      el.addEventListener("pointerleave", release);
      el.addEventListener("pointercancel", release);
    }

    function bindKeyboard() {
      window.addEventListener("keydown", (event) => {
        const code = event.code;

        if (["ArrowLeft", "KeyA"].includes(code)) input.left = true;
        if (["ArrowRight", "KeyD"].includes(code)) input.right = true;
        if (["ArrowUp", "KeyW"].includes(code)) input.gas = true;
        if (["ArrowDown", "KeyS"].includes(code)) input.brake = true;

        if (code === "Space" && (!state.started || state.over)) {
          event.preventDefault();
          startGame();
        }
      });

      window.addEventListener("keyup", (event) => {
        const code = event.code;

        if (["ArrowLeft", "KeyA"].includes(code)) input.left = false;
        if (["ArrowRight", "KeyD"].includes(code)) input.right = false;
        if (["ArrowUp", "KeyW"].includes(code)) input.gas = false;
        if (["ArrowDown", "KeyS"].includes(code)) input.brake = false;
      });
    }

    function spawnTraffic() {
      const lane = (Math.random() * 2 - 1) * 1.7;
      const z = SETTINGS.worldLength + Math.random() * 320;
      const speed = 30 + Math.random() * 55 + state.score * 0.02;
      const color = `hsl(${Math.random() * 200 + 180}, 75%, 60%)`;

      state.traffic.push({ lane, z, speed, color });
    }

    function crash() {
      if (state.flashTimer > 0 || state.over) return;

      state.lives -= 1;
      state.flashTimer = 18;
      state.speed = Math.max(48, state.speed * 0.5);
      state.playerX = 0;

      if (state.lives <= 0) {
        state.over = true;
        state.started = false;
        showStart();
      }

      updateHud();
    }

    function updateTraffic(dt) {
      for (let i = state.traffic.length - 1; i >= 0; i--) {
        const car = state.traffic[i];
        car.z -= (state.speed + car.speed) * dt * 0.12;

        if (car.z < -40) {
          state.traffic.splice(i, 1);
          state.score += 12;
          continue;
        }

        if (car.z < 50 && car.z > -10) {
          const laneDiff = Math.abs(car.lane - state.playerX);
          if (laneDiff < 0.55) {
            crash();
            state.traffic.splice(i, 1);
          }
        }
      }

      if (state.traffic.length < SETTINGS.maxTraffic) {
        if (Math.random() < 0.035 + dt * 0.02) {
          spawnTraffic();
        }
      }
    }

    function update(dt) {
      if (!state.started || state.over) return;

      if (input.gas) state.speed += 18 * dt;
      if (input.brake) state.speed -= 28 * dt;
      state.speed *= 0.985;
      state.speed = clamp(state.speed, 35, state.maxSpeed);

      const steering = (input.left ? -1 : 0) + (input.right ? 1 : 0);
      state.playerX += steering * (0.78 + state.speed * 0.01) * dt;
      state.playerX = clamp(state.playerX, -1.95, 1.95);

      state.distance += state.speed * dt * 0.38;
      updateTraffic(dt);
      state.score += dt * 1.2;

      if (state.flashTimer > 0) {
        state.flashTimer -= dt;
      }

      updateHud();
    }

    function roadCenterAtDepth(z) {
      const curve = Math.sin((state.distance + z * 0.8) * 0.024) * 180;
      return state.width / 2 + curve;
    }

    function roadWidthAtDepth(z) {
      const t = clamp(1 - z / SETTINGS.worldLength, 0, 1);
      return SETTINGS.roadWidthMin + t * (SETTINGS.roadWidthMax - SETTINGS.roadWidthMin);
    }

    function worldToScreen(z, lane) {
      const pct = clamp(z / SETTINGS.worldLength, 0, 1);
      const roadHalf = roadWidthAtDepth(z) * 0.5;
      const center = roadCenterAtDepth(z);
      const x = center + lane * roadHalf * 0.72;
      const y = state.height * (0.28 + (1 - pct) * 0.72);
      const scale = 0.5 + (1 - pct) * 1.7;
      return { x, y, scale, roadHalf, center };
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, state.height);
      sky.addColorStop(0, "#0d2237");
      sky.addColorStop(0.4, "#224d63");
      sky.addColorStop(1, "#264d42");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, state.width, state.height);

      const sunX = state.width * 0.75;
      const sunY = state.height * 0.16;
      const glow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 220);
      glow.addColorStop(0, "rgba(255, 206, 110, 0.95)");
      glow.addColorStop(0.45, "rgba(255, 162, 0, 0.35)");
      glow.addColorStop(1, "rgba(255, 162, 0, 0)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, state.width, state.height);

      ctx.fillStyle = "#1b3d33";
      ctx.beginPath();
      ctx.moveTo(0, state.height * 0.72);
      for (let i = 0; i <= 10; i++) {
        const x = (state.width / 10) * i;
        const peak = state.height * (0.58 + Math.sin(i * 1.3 + state.distance * 0.02) * 0.06);
        ctx.lineTo(x, peak);
      }
      ctx.lineTo(state.width, state.height);
      ctx.lineTo(0, state.height);
      ctx.closePath();
      ctx.fill();
    }

    function drawRoad() {
      const segments = 24;
      const farZ = SETTINGS.worldLength;

      for (let i = segments - 1; i >= 0; i--) {
        const z0 = (i / segments) * farZ;
        const z1 = ((i + 1) / segments) * farZ;

        const p0 = worldToScreen(z0, 0);
        const p1 = worldToScreen(z1, 0);

        const left0 = p0.center - p0.roadHalf;
        const right0 = p0.center + p0.roadHalf;
        const left1 = p1.center - p1.roadHalf;
        const right1 = p1.center + p1.roadHalf;

        ctx.fillStyle = i % 2 === 0 ? "#2b2d33" : "#30343b";
        ctx.beginPath();
        ctx.moveTo(left0, p0.y);
        ctx.lineTo(right0, p0.y);
        ctx.lineTo(right1, p1.y);
        ctx.lineTo(left1, p1.y);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#b8c8af";
        ctx.fillRect(left0 - 14, p0.y, 14, p1.y - p0.y);
        ctx.fillRect(right0, p0.y, 14, p1.y - p0.y);

        const laneLine = (p0.roadHalf * 2) / 3;
        ctx.strokeStyle = "#f5f7ff";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p0.center - laneLine * 0.5, p0.y);
        ctx.lineTo(p1.center - laneLine * 0.5, p1.y);

        ctx.moveTo(p0.center + laneLine * 0.5, p0.y);
        ctx.lineTo(p1.center + laneLine * 0.5, p1.y);
        ctx.stroke();
      }
    }

    function drawTrafficCars() {
      for (const car of state.traffic) {
        const p = worldToScreen(car.z, car.lane);
        const width = 28 * p.scale;
        const height = 52 * p.scale;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.fillStyle = car.color;
        ctx.fillRect(-width / 2, -height / 2, width, height);

        ctx.fillStyle = "rgba(255,255,255,0.65)";
        ctx.fillRect(-width * 0.35, -height * 0.25, width * 0.7, height * 0.28);

        ctx.fillStyle = "#ffe66d";
        ctx.fillRect(-width * 0.25, -height / 2 + 3, width * 0.2, 5);
        ctx.fillRect(width * 0.05, -height / 2 + 3, width * 0.2, 5);

        ctx.fillStyle = "#ff4d6d";
        ctx.fillRect(-width * 0.25, height / 2 - 8, width * 0.2, 5);
        ctx.fillRect(width * 0.05, height / 2 - 8, width * 0.2, 5);
        ctx.restore();
      }
    }

    function drawPlayerCar() {
      const x = state.width / 2 + state.playerX * 145;
      const y = state.height * 0.86;
      const w = 64;
      const h = 100;

      ctx.save();
      ctx.translate(x, y);

      const pulse = state.flashTimer > 0 && Math.floor(state.flashTimer * 8) % 2 === 0;
      ctx.fillStyle = pulse ? "#f5f9ff" : "#ff7b00";
      ctx.fillRect(-w / 2, -h / 2, w, h);

      ctx.fillStyle = "rgba(255,255,255,0.72)";
      ctx.fillRect(-w * 0.24, -h * 0.18, w * 0.48, h * 0.24);

      ctx.fillStyle = "#ffe66d";
      ctx.fillRect(-w * 0.18, -h / 2 + 6, w * 0.18, 6);
      ctx.fillRect(w * 0.03, -h / 2 + 6, w * 0.18, 6);

      ctx.fillStyle = "#ff4d6d";
      ctx.fillRect(-w * 0.18, h / 2 - 12, w * 0.18, 6);
      ctx.fillRect(w * 0.03, h / 2 - 12, w * 0.18, 6);

      ctx.fillStyle = "#111";
      ctx.fillRect(-w / 2 + 8, -h / 2 + 10, 12, 18);
      ctx.fillRect(w / 2 - 20, -h / 2 + 10, 12, 18);
      ctx.fillRect(-w / 2 + 8, h / 2 - 28, 12, 18);
      ctx.fillRect(w / 2 - 20, h / 2 - 28, 12, 18);
      ctx.restore();
    }

    function drawHudText() {
      if (!state.started && !state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.2)";
      ctx.fillRect(16, state.height - 64, 220, 42);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 18px Arial";
      ctx.fillText("Speed: " + Math.floor(state.speed) + " km/h", 28, state.height - 35);
    }

    function drawGameOver() {
      if (!state.over) return;

      ctx.fillStyle = "rgba(0,0,0,0.45)";
      ctx.fillRect(0, 0, state.width, state.height);

      ctx.fillStyle = "#ff4d6d";
      ctx.textAlign = "center";
      ctx.font = "bold 54px Arial";
      ctx.fillText("CRASH!", state.width / 2, state.height / 2 - 28);

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 28px Arial";
      ctx.fillText("Score: " + Math.floor(state.score), state.width / 2, state.height / 2 + 26);

      ctx.font = "20px Arial";
      ctx.fillText("Tap Start or press SPACE", state.width / 2, state.height / 2 + 62);
      ctx.textAlign = "left";
    }

    function render() {
      ctx.clearRect(0, 0, state.width, state.height);
      drawSky();
      drawRoad();
      drawTrafficCars();
      drawPlayerCar();
      drawHudText();
      drawGameOver();
    }

    function tick(timestamp) {
      const dt = Math.min((timestamp - (state.lastTime || timestamp)) / 16.666, 1.8) || 1;
      state.lastTime = timestamp;
      update(dt);
      render();
      requestAnimationFrame(tick);
    }

    bindButtonEvents(leftBtn, "left");
    bindButtonEvents(rightBtn, "right");
    bindButtonEvents(brakeBtn, "brake");
    bindButtonEvents(gasBtn, "gas");
    bindKeyboard();

    startBtn.addEventListener("click", startGame);
    window.addEventListener("resize", resizeCanvas);

    canvas.addEventListener("pointerdown", () => {
      if (!state.started || state.over) {
        startGame();
      }
    });

    resizeCanvas();
    resetGame();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
