<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIB Electronic Delivery Systems | Commercial Hardware Catalog</title>
    <style>
        /* Premium Core Styling (Slate Gray & Rose Gold Theme) */
        :root {
            --slate-gray: #2c3539;
            --dark-obsidian: #121212;
            --rose-gold: #b76e79;
            --ice-white: #f5f5f7;
            --muted-gray: #8e8e93;
            --card-bg: #161617;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--dark-obsidian);
            color: var(--ice-white);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Mandatory Age Gate Overlay */
        #age-gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--dark-obsidian);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .gate-card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        .gate-logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 4px;
            color: var(--ice-white);
            margin-bottom: 10px;
        }

        .gate-logo span {
            color: var(--rose-gold);
        }

        .gate-card h2 {
            font-size: 1.2rem;
            margin-bottom: 25px;
            color: var(--muted-gray);
            font-weight: 400;
        }

        .gate-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-confirm {
            background-color: var(--rose-gold);
            color: white;
            display: block;
            width: 100%;
            text-align: center;
        }

        .btn-confirm:hover {
            opacity: 0.9;
        }

        .btn-deny {
            background-color: transparent;
            color: var(--muted-gray);
            border: 1px solid #3a3a3a;
        }

        .btn-deny:hover {
            background-color: #222;
        }

        /* Main Website Layout Content */
        #main-content {
            display: none;
            padding: 40px 20px;
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        .brand-logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 5px;
        }

        .brand-logo span {
            color: var(--rose-gold);
        }

        .tagline {
            color: var(--muted-gray);
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Model Selector Tabs - Sequential Pipeline Layout */
        .tab-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background-color: #1c1c1e;
            color: var(--muted-gray);
            border: 1px solid var(--border-color);
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab-btn.active, .tab-btn:hover {
            background-color: var(--rose-gold);
            color: white;
            border-color: var(--rose-gold);
        }

        /* Products Showcase Display Sections */
        .product-section {
            display: none;
        }

        .product-section.active {
            display: block;
        }

        /* Twin Architecture Spec Grid */
        .showcase-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            margin-bottom: 50px;
        }

        @media (min-width: 768px) {
            .showcase-grid {
                grid-template-columns: 1.2fr 1fr;
            }
        }

        .profile-box {
            background: linear-gradient(145deg, #181819, #121213);
            border-radius: 12px;
            padding: 35px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .model-badge {
            display: inline-block;
            background-color: rgba(183, 110, 121, 0.15);
            color: var(--rose-gold);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 15px;
            align-self: flex-start;
        }

        .profile-box h2 {
            font-size: 2rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .profile-box p {
            color: var(--muted-gray);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .price-tag {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--ice-white);
            margin-bottom: 10px;
        }

        .price-tag span {
            font-size: 0.85rem;
            color: var(--muted-gray);
            font-weight: 400;
            margin-left: 5px;
        }

        .spec-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 35px;
            border: 1px solid var(--border-color);
        }

        .spec-box h3 {
            font-size: 1.1rem;
            color: var(--rose-gold);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spec-list dt {
            font-weight: 700;
            color: var(--ice-white);
            margin-top: 15px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spec-list dd {
            color: var(--muted-gray);
            font-size: 0.9rem;
            margin-bottom: 15px;
            margin-left: 0;
            line-height: 1.5;
        }

        /* Shared B2B Procurement Footer Area */
        .cta-section {
            text-align: center;
            background: linear-gradient(145deg, #1c1c1e, #121212);
            padding: 45px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            margin-bottom: 50px;
        }

        .cta-section h4 {
            font-size: 1.6rem;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .cta-section p {
            color: var(--muted-gray);
            margin-bottom: 30px;
            font-size: 0.95rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-btn {
            display: inline-block;
            background-color: transparent;
            color: var(--ice-white);
            border: 2px solid var(--rose-gold);
            padding: 16px 40px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .cta-btn:hover {
            background-color: var(--rose-gold);
            color: white;
            box-shadow: 0 0 20px rgba(183, 110, 121, 0.4);
        }

        /* Compulsory Regulatory South African Label Area */
        .gov-warning {
            background-color: white;
            color: black;
            padding: 25px;
            font-weight: 700;
            text-align: center;
            border-radius: 4px;
            border: 4px solid black;
            font-size: 1.05rem;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Age Verification Filter Overlay -->
    <div id="age-gate">
        <div class="gate-card">
            <div class="gate-logo">PIB<span>//</span></div>
            <h2>ELECTRONIC DELIVERY SYSTEMS</h2>
            <p style="font-size: 0.9rem; color: var(--muted-gray); margin-bottom: 25px;">
                You must be 18 years of age or older to view the commercial hardware portfolio in South Africa.
            </p>
            <div class="gate-buttons">
                <button class="btn btn-confirm" id="confirm-btn">I am 18+</button>
                <button class="btn btn-deny" id="deny-btn">Exit</button>
            </div>
        </div>
    </div>

    <!-- Main Website Layout Content -->
    <div id="main-content">
        <header>
            <div class="brand-logo">PIB<span>.</span></div>
            <div class="tagline">System Evolution & Deployment Line // South Africa</div>
        </header>
