<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pong</title>
  <style>
    :root {
      --bg: #0d1321;
      --panel: #1a2333;
      --paddle: #e6f1ff;
      --ball: #ffb703;
      --line: rgba(255,255,255,0.2);
      --text: #f5f7ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #20304d 0%, var(--bg) 60%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .scoreboard {
      width: 900px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      background: rgba(17, 24, 39, 0.7);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 14px 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
    }

    .score {
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      letter-spacing: 2px;
    }

    .score.left {
      justify-self: start;
    }

    .score.right {
      justify-self: end;
    }

    .game-label {
      font-size: 0.8rem;
      letter-spacing: 0.35rem;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      text-align: center;
    }

    canvas {
      display: block;
      width: 900px;
      height: 500px;
      background: #0b1020;
      border: 2px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.3);
    }

    @media (max-width: 920px) {
      .scoreboard,
      canvas {
        width: min(90vw, 900px);
      }
    }
  </style>
</head>
<body>
  <div class="game">
    <div class="scoreboard">
      <div class="score left" id="leftScore">0</div>
      <div class="game-label">PONG</div>
      <div class="score right" id="rightScore">0</div>
    </div>

    <canvas id="gameCanvas" width="900" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");

    const keys = {};
    const paddleWidth = 12;
    const paddleHeight = 100;
    const paddleOffset = 20;

    const leftPaddle = {
      x: paddleOffset,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 8
    };

    const rightPaddle = {
      x: canvas.width - paddleOffset - paddleWidth,
      y: canvas.height / 2 - paddleHeight / 2,
      width: paddleWidth,
      height: paddleHeight,
      speed: 5.2
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      radius: 8,
      speed: 5.8,
      vx: 0,
      vy: 0
    };

    let mouseY = 0;
    let mouseActive = false;

    let score = {
      left: 0,
      right: 0
    };

    function updateScoreboard() {
      leftScoreEl.textContent = score.left;
      rightScoreEl.textContent = score.right;
    }

    function resetBall(direction = 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() - 0.5) * (Math.PI / 3); // -60° to +60°
      const speed = ball.speed + Math.random() * 0.7;

      ball.vx = direction * speed * Math.cos(angle);
      ball.vy = speed * Math.sin(angle);
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function handleKeyboardInput() {
      if (keys.ArrowUp) leftPaddle.y -= leftPaddle.speed;
      if (keys.ArrowDown) leftPaddle.y += leftPaddle.speed;

      leftPaddle.y = clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);

      if (mouseActive) {
        leftPaddle.y = clamp(mouseY - leftPaddle.height / 2, 0, canvas.height - leftPaddle.height);
      }
    }

    function moveComputerPaddle() {
      const targetY = ball.y - rightPaddle.height / 2;
      const diff = targetY - rightPaddle.y;

      if (Math.abs(diff) < rightPaddle.speed) {
        rightPaddle.y = targetY;
      } else {
        rightPaddle.y += Math.sign(diff) * rightPaddle.speed;
      }

      rightPaddle.y = clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
    }

    function handleWallCollision() {
      if (ball.y - ball.radius <= 0 || ball.y + ball.radius >= canvas.height) {
        ball.y = clamp(ball.y, ball.radius, canvas.height - ball.radius);
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision(paddle, isLeft) {
      const paddleLeft = paddle.x;
      const paddleRight = paddle.x + paddle.width;
      const paddleTop = paddle.y;
      const paddleBottom = paddle.y + paddle.height;

      const intersects =
        ball.x + ball.radius >= paddleLeft &&
        ball.x - ball.radius <= paddleRight &&
        ball.y + ball.radius >= paddleTop &&
        ball.y - ball.radius <= paddleBottom;

      if (!intersects) return;

      if (isLeft && ball.vx < 0) {
        ball.x = paddleRight + ball.radius;
        const impact = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const bounce = impact * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.05;
        ball.vx = speed * Math.cos(bounce);
        ball.vy = speed * Math.sin(bounce);
      }

      if (!isLeft && ball.vx > 0) {
        ball.x = paddleLeft - ball.radius;
        const impact = (ball.y - (paddle.y + paddle.height / 2)) / (paddle.height / 2);
        const bounce = impact * (Math.PI / 3);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.05;
        ball.vx = -speed * Math.cos(bounce);
        ball.vy = speed * Math.sin(bounce);
      }
    }

    function update() {
      handleKeyboardInput();
      moveComputerPaddle();

      ball.x += ball.vx;
      ball.y += ball.vy;

      handleWallCollision();
      handlePaddleCollision(leftPaddle, true);
      handlePaddleCollision(rightPaddle, false);

      if (ball.x - ball.radius <= 0) {
        score.right += 1;
        updateScoreboard();
        resetBall(1);
      }

      if (ball.x + ball.radius >= canvas.width) {
        score.left += 1;
        updateScoreboard();
        resetBall(-1);
      }
    }

    function drawNet() {
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 14]);

      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();

      ctx.setLineDash([]);
    }

    function drawPaddle(paddle) {
      ctx.fillStyle = "#e6f1ff";
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.fillStyle = "#ffb703";
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Dark background
      ctx.fillStyle = "#0b1020";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawNet();
      drawPaddle(leftPaddle);
      drawPaddle(rightPaddle);
      drawBall();
    }

    window.addEventListener("keydown", (event) => {
      keys[event.code] = true;
    });

    window.addEventListener("keyup", (event) => {
      keys[event.code] = false;
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      mouseY = event.clientY - rect.top;
      mouseActive = true;
    });

    canvas.addEventListener("mouseleave", () => {
      mouseActive = false;
    });

    updateScoreboard();
    resetBall(1);

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
